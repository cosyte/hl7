version: 2
updates:
  # npm dev-dependencies (the parsers ship zero runtime deps)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Wait a day after a release before proposing it, the same 24 hours pnpm-workspace.yaml's
    # minimumReleaseAge holds every install to. Security updates are not delayed.
    cooldown:
      default-days: 1
    # The commit message, and so the pull request title, is `chore(deps-dev): bump ...`:
    # Conventional Commits, which pr-title.yml checks on every pull request.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node stays on the major of the lowest Node line we support (22, `engines`), so the
      # types never offer an API that Node 22 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @cosyte/process owns the tool versions. This repository declares three of them directly,
      # pinned to exactly the versions process runs: vitest because test files import it
      # (typecheck needs its types), typescript because tests and scripts import the compiler API,
      # and prettier because the `version` script and the release's `changeset version` resolve it
      # from this repository's root. `cosyte-process check` fails a vitest mismatch. They move when
      # process does, never on their own.
      - dependency-name: "vitest"
      - dependency-name: "typescript"
      - dependency-name: "prettier"
  # keep GitHub Actions references current
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # From v1.75.0 this action installs actionlint by piping a script from a fork to bash. No
      # workflow here uses it any more: the shared CI and the `extras` job run the official
      # rhysd/actionlint release, checked by its SHA-256. This keeps an update from proposing it again.
      - dependency-name: "reviewdog/action-actionlint"
      # The cosyte/.github reusable workflows are pinned to the commit of a published `workflows-*`
      # reference and move by hand, with every caller here, together (ST37). Left to Dependabot, a
      # commit pin with no version tag is offered the newest commit on cosyte/.github's main, which is
      # not a published reference.
      - dependency-name: "cosyte/.github*"
