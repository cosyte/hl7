version: 2
updates:
  # npm dev-dependencies (the parsers ship zero runtime deps)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Wait a day after a release before proposing it, the same 24 hours pnpm-workspace.yaml's
    # minimumReleaseAge holds every install to. Security updates are not delayed.
    cooldown:
      default-days: 1
    # The commit message, and so the pull request title, is `chore(deps-dev): bump ...`:
    # Conventional Commits, which pr-title.yml checks on every pull request.
    commit-message:
      prefix: chore
      include: scope
  # keep GitHub Actions references current
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # From v1.75.0 this action installs actionlint by piping a script from a fork to bash. The
      # shared CI runs the official rhysd/actionlint release, checked by its SHA-256, instead, and
      # the `extras` job's pin stays on a release from before that change.
      - dependency-name: "reviewdog/action-actionlint"
