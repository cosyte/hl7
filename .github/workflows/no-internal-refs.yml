name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers (`HL7-N`), phase and wave language, ADR numbers, meta-repo paths
# and process commentary belong in the changeset, CHANGELOG.md, the commit, the PR and the
# roadmap, never in README.md, docs-content/, or the npm description. The rule is written
# out in the meta-repo's `documentation/conventions.md` ("No internal project bookkeeping
# on a public surface"); `scripts/check-no-internal-refs.sh` is what enforces it.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed 149 of these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes `(CCDA-P8)` into a README; a job that reds does not.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. Same reasoning as the em-dash gate next
# door, and the first half is the deciding one:
#
#   The reusable pipeline is not an option. hl7's `ci` job calls
#   cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed ladder and no arbitrary
#   repo script. Adding this there would also flip every other caller red on its next run:
#   the measured backlog was 149 internal references across 11 repos, and remediating each
#   is its own deliberate piece of work. A shared pipeline is the wrong place to land a rule
#   most of its callers cannot yet satisfy.
#
#   Within hl7, keeping it out of ci.yml also keeps it cheap: this job is a checkout and a
#   handful of greps over 26 markdown/JSON files, while ci.yml drives the full Node 22 + 24
#   matrix plus the extras job.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# The em-dash gate scans all three because the brand rule names commit messages explicitly.
# THIS rule says the opposite: identifiers BELONG in the commit, the PR and the changeset,
# so a PR-text half here would red on correct work. That is also why there is no `edited`
# trigger: nothing here reads PR text, so retitling a PR cannot change the result.
#
# The other half of this rule, the one that keeps identifiers out of a published RELEASE
# BODY, lives in the shared pipeline: `cosyte/.github` `scripts/release-notes.mjs assert`
# re-reads the finished body bytes and refuses to publish a violating one. This job covers
# the repo's own files; that one covers what gets published to the releases page.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-internal-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The script self-tests before it reports: it proves each rule still matches its own
      # positive sample AND still lets through the reference material it was most likely to
      # destroy (`MSH-2`, `PID-3`, `TQ1-7`, `ICD-10-CM`, `FHIR-bridge`). It refuses to print
      # OK from a scan that did not read all of its input. No `|| true`, no `continue-on-error`:
      # a check that cannot fail is documentation.
      - name: Check the public surface
        run: bash scripts/check-no-internal-refs.sh
