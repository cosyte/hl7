name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers (`HL7-N`), phase and wave language, ADR numbers, meta-repo paths
# and process commentary belong in the changeset, CHANGELOG.md, the commit, the PR and the
# roadmap, never in README.md, docs-content/, or the npm description.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed 149 of these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes `(CCDA-P8)` into a README; a job that reds does not.
#
# WHAT ACTUALLY SCANS. `pnpm check:no-internal-refs`, which runs `scripts/check-no-internal-refs.mjs`,
# a caller that hands this repository's own axes to the published `@cosyte/script-utils`
# internal-reference gate: the prefixes, the standards designations that must never be flagged,
# the public surface, the tarball accounting and the source doc-comment pass. The rules, the
# self-test floor and every refusal live in that package, in ONE copy across the estate. The job
# below delegates the plumbing (checkout, pnpm, Node) to the shared gate workflow, which carries
# no pattern, no allow-list and no file selection of its own: it prepares the tree, runs the
# command, and lets the command's exit status decide the job.
#
# THE GATE NEEDS THE INSTALL, DELIBERATELY, AND FAILS CLOSED WITHOUT IT. Reaching a published
# package by specifier means this can no longer run before dependencies are installed. The
# property traded away is "the gate runs even if the install is broken"; what replaces it is that
# an install that failed, or an implementation that cannot be reached, EXITS NON-ZERO and never
# prints the OK line. The scan still self-tests before it reports: each rule must still match its
# own positive sample AND still let through the reference material it was most likely to destroy
# (`MSH-2`, `PID-3`, `TQ1-7`, `ICD-10-CM`, `FHIR-bridge`), and it still refuses to print OK from
# a scan that did not read all of its input.
#
# WHICH IS WHY THIS NAMES THE INSTALLING FORM OF THE SHARED GATE. `cosyte/.github` publishes two
# forms of this workflow that differ in one step: `gate-no-internal-refs.yml` hands the scan a
# tree with pnpm and Node prepared and no `node_modules`, which is right for a gate that is a
# dependency-free shell script, and `gate-no-internal-refs-install.yml` runs
# `pnpm install --frozen-lockfile` from the caller's committed lockfile first. The scan here
# reaches an installed package, so it takes the second, and the choice is the `uses:` LINE
# rather than an input: a caller job that delegates carries no `with:` key, and
# `test/workflows/gate-caller-contract.test.ts` refuses one. Both forms publish the same
# `public-surface` job id, so the check-run context and every ruleset entry naming it are
# unchanged. The install is not a fallback and does not soften the refusal above: a failed
# install reds the job before the scan runs, and the scan still refuses when it cannot reach
# the implementation.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below publishes
# `no-internal-refs / public-surface`, which is the context a branch ruleset requires.
# Renaming the job detaches that requirement with no error anywhere, and a required context
# nothing emits blocks every pull request. Do not rename it.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# The em-dash gate next door scans all three because the brand rule names commit messages
# explicitly. THIS rule says the opposite: identifiers BELONG in the commit, the PR and the
# changeset, so a PR-text half here would red on correct work. That is also why there is no
# `edited` trigger: nothing here reads PR text, so retitling a PR cannot change the result.
#
# The other half of this rule, the one that keeps identifiers out of a published RELEASE
# BODY, lives in the shared pipeline: `cosyte/.github` `scripts/release-notes.mjs assert`
# re-reads the finished body bytes and refuses to publish a violating one. This job covers
# the repo's own files; that one covers what gets published to the releases page.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Pinned to the 40-character commit, not to the tag beside it: a tag can be moved or
    # deleted by anyone who gains write access to the workflow's repository, so a tag is not
    # an immutable reference and is not a pin. The trailing comment is the published
    # reference that commit was released as, so the release note stays findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@acaa6cbe1745e950837e61849ed84bf9e34fec68 # workflows-2026-09-22-acaa6cbe1745
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be downgraded
    # by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
