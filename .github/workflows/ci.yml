name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:11 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "11 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on Node 22, 24, and 26. hl7 ships a PHI scanner, so the
  # shared pipeline's optional PHI-scan step is switched on.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    with:
      run-phi-scan: true

  # hl7-specific extras: the examples smoke (exercises real parse/build/serialize usage) + the
  # profile-starter-kit growth template (install/typecheck/lint/test/build) + actionlint on the kit's
  # workflows. pnpm 10 only WARNS on esbuild's build script, so the kit's --no-frozen-lockfile install
  # completes here (the kit is a copy-and-customize template; it commits no lockfile).
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (examples + kit import the built package)
        run: pnpm build
      - name: Examples (smoke)
        run: pnpm examples
      # The operator, 2026-11-08: "proceed with hl7 past the wave 2. Do not wait for the 24 hours
      # this time". So CI's install of the kit takes the root's @cosyte exemption from pnpm's
      # 24-hour minimumReleaseAge, appended to the runner's copy of the kit's pnpm-workspace.yaml,
      # and the kit installs a @cosyte/script-utils release on the day it publishes. The tracked
      # file, the one a consumer copies, keeps the floor for every package.
      - name: Starter kit (the root's @cosyte release-age exemption, on the runner only)
        working-directory: examples/profile-starter-kit
        run: printf '\nminimumReleaseAgeExclude:\n  - "@cosyte/*"\n' >> pnpm-workspace.yaml
      - name: Starter kit (install + typecheck + lint + test + build)
        working-directory: examples/profile-starter-kit
        run: |
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      # The kit's workflows are linted by the same actionlint the shared CI's `actionlint` job runs
      # over this repository's own (EN6), installed by that job's steps: rhysd/actionlint's release
      # binary at the version and SHA-256 below, checked before it is unpacked. Never
      # reviewdog/action-actionlint, which from v1.75.0 installs actionlint by piping a fork's
      # script to bash. A new version changes both values together, with the shared job's.
      - name: Install actionlint at the pinned version and checksum
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" --version
          shellcheck --version
      # Every workflow file the kit tracks, so a new one is linted without an edit here. The step
      # fails on actionlint's own exit status, and on finding no file at all.
      - name: Validate kit workflows (actionlint)
        shell: bash
        run: |
          set -euo pipefail
          listed="$(git ls-files -- 'examples/profile-starter-kit/.github/workflows/*.yml' \
            'examples/profile-starter-kit/.github/workflows/*.yaml')"
          if [ -z "${listed}" ]; then
            echo "::error::no workflow file found under examples/profile-starter-kit/.github/workflows/"
            exit 1
          fi
          mapfile -t files <<< "${listed}"
          "${RUNNER_TEMP}/actionlint" -color "${files[@]}"
          echo "actionlint clean over ${#files[@]} kit workflow file(s)."

  # The repository's documents, each graded by the shared checker @cosyte/script-utils ships: the
  # README against the house skeleton and npm's size limit, CLAUDE.md against the card spec, and
  # the package.json description against the catalog of our libraries.
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:claude-card
      - run: pnpm check:catalog
