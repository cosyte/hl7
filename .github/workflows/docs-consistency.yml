name: Docs consistency

# `docs-content/` is what `pnpm pack:docs` tars into the release artifact that docs.cosyte.com
# ingests, so it is published, not just tracked. Two consequences drive this job:
#
#   PUBLICATION IS THE PART NO RE-RUN UNDOES. `pnpm phi-scan` does not read markdown (its walk
#   excludes it deliberately, because markdown may legitimately describe a violator value), so a
#   sample value written into a `PID|` line on one of these pages reaches the tarball and the
#   rendered site with nothing in front of it. `check:docs` carries the sample-data floor that
#   closes that gap: no nine-digit dashed identifier, no telephone number outside the 555
#   reservation, no email address outside example.com / example.org, on any HL7-shaped line.
#
#   A REVIEWER RE-READING 23 PAGES IS NOT A GATE. The rest of the script is the metadata and
#   contract uniformity a reader of the site depends on: frontmatter keys, one link form, a
#   sidebar that agrees with the files on disk, and a code reference that carries every key of
#   WARNING_CODES and FATAL_CODES with prose beside it. A code added to the source and not to the
#   page reds this job rather than shipping a promise the site does not keep.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. Same reasoning as the em-dash and
# public-surface gates next door: hl7's `ci` job calls the reusable cosyte/.github pipeline, which
# runs a fixed ladder and no arbitrary repo script. Keeping this out of ci.yml also keeps it cheap,
# since it is one install and one pass over the docs bundle rather than the full Node matrix.
#
# Run it locally with `pnpm check:docs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No `|| true`, no `continue-on-error`: a check that cannot fail is documentation. The
      # script refuses an empty scan, an unreadable page and an unparseable frontmatter block
      # rather than reporting a clean result over the files it managed to read.
      - name: Check the docs bundle
        run: pnpm check:docs
