name: Em-dash gate

# The brand rule (founder directive 2026-07-24, knowledgebase 06-brand/voice-and-tone.md)
# bans U+2014 outright across every cosyte surface, and names commit messages explicitly.
# This repository is clean, so the gate exists purely to keep it that way. A green run on a
# clean tree proves nothing on its own, which is why the script it calls refuses to print OK
# from a scan that did not read everything.
#
# WHAT ACTUALLY SCANS. `pnpm check:no-emdash`, which reaches the one em-dash gate the
# estate publishes in `@cosyte/script-utils`. This repository tracks no implementation of
# its own and declares only what its scan leaves out. The job below delegates the plumbing
# (checkout, pnpm, Node) to the shared gate workflow, and that workflow carries no pattern,
# no allow-list and no file selection of its own: it prepares the tree, runs the command,
# and lets the command's exit status decide the job.
#
# THERE IS NO INSTALL STEP ON THIS PATH, and none can be added: a reusable workflow takes
# no install and a job that calls one carries no steps of its own. The command installs
# from the committed lockfile itself when the package is not on disk, and exits non-zero
# naming what it could not reach rather than reporting a clean tree.
#
# TWO CONTEXTS, NOT ONE, AND THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. A branch ruleset binds to those
# exact strings: renaming the job detaches the requirement with no error anywhere, and a
# required context nothing emits blocks every pull request. Do not rename it.
#
#   `no-emdash / tracked-files` is REQUIRED and is the one that blocks a merge.
#   `no-emdash / messages` runs, reds its own context, and is deliberately NOT required.
#   Dependabot composes a pull request body out of upstream release notes, em dashes
#   included, and a gate that fails on someone else's clock becomes a tax. The detection is
#   unchanged either way; only what blocks is narrowed, and that narrowing is deliberate.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. The deciding factor is the trigger. The
# messages half needs the `edited` activity type, which is not a default: without it, a
# title or body edited after the last push is never re-checked, and since this repo
# squash-merges, the PR title and body ARE the commit message that lands on main. But
# ci.yml's triggers drive the full Node 22 + 24 matrix (typecheck, lint, format, PHI scan,
# test, coverage, build, attw, dual ESM/CJS smoke) plus the `extras` job. Re-running all of
# that every time someone fixes a typo in a PR description is a large cost for no extra
# safety.
#
# Run it locally with `pnpm check:no-emdash`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # Pinned to the 40-character commit, not to the tag beside it: a tag can be moved or
    # deleted by anyone who gains write access to the workflow's repository, so a tag is not
    # an immutable reference and is not a pin. The trailing comment is the published
    # reference that commit was released as, so the release note stays findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-emdash.yml@84ecccd771cbc9c1ece003a3f8ff61415360395b # workflows-2026-09-18-84ecccd771cb
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be downgraded
    # by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
