name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish through trusted publishing
# (OIDC, with provenance) -> docs artifacts -> GitHub release -> repository_dispatch to cosyte/docs.
# No npm token exists: the package's trusted publisher on npmjs.com names this repository and this
# file, and npm exchanges the job's `id-token: write` grant for a short-lived publish token.
# `secrets: inherit` passes DOCS_REPO_DISPATCH_TOKEN, and RELEASE_PR_TOKEN when one is set.

on:
  push:
    branches: [main]

# Read-only by default: the release job below grants itself the writes the shared pipeline needs.
permissions:
  contents: read

jobs:
  release:
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs). That is what every Release run did from June until this.
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # workflows-2026-11-10-398cd4ded647
    with:
      package-name: "@cosyte/hl7"
      # The release gates, each a step of the shared `version` job, run before anything can publish:
      # - the latest weekly mutation result: the newest completed run of weekly-mutation.yml on main
      #   must have succeeded and be 8 days old or less. On for every caller (`mutation-workflow` and
      #   `mutation-max-age-days` keep their defaults). Until weekly-mutation.yml has a green run on
      #   main, a release stops here;
      # - the package checks: the manifest names only specifiers a registry can resolve, then
      #   `npm pack`, every declared file and `exports` target is in the tarball, it installs into a
      #   clean directory and each entry point loads by name;
      # - the docs samples: that exact tarball installed into a clean project, and every TypeScript
      #   and JavaScript sample under docs-content/ (the generated api/ folder left out) run there.
      # Provenance and an SBOM attached to the GitHub release are on for every caller.
      run-package-checks: true
      run-tarball-samples: true
      docs-dir: "docs-content"
    secrets: inherit
