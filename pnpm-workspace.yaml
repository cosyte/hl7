# ---------------------------------------------------------------------------
# INSTALL HARDENING. These two settings are the only defence this repository
# has against a compromised release during the window between its publication
# and its removal from the registry. pnpm 10.34.5 ships both switched off
# (minimumReleaseAge defaults to 0 before v11, trustPolicy to off), so every
# value below is load-bearing and none of it is a default. The packageManager
# pin moved to 10.34.5 for exactly this reason: minimumReleaseAge arrived in
# pnpm 10.16.0 and trustPolicy in 10.21.0, and an older pnpm ignores both keys
# entirely, which is a settings file that decorates rather than defends.
#
# THERE IS DELIBERATELY NO `packages:` KEY. This repository is a single
# package, not a pnpm workspace: pnpm-lock.yaml declares one importer, `.`.
# examples/profile-starter-kit is a copy-and-customize TEMPLATE whose name is
# still the literal placeholder text a consumer replaces, so enrolling it here
# would drag an unresolvable package into the root install. Because the mere
# presence of this file makes the repository root a workspace root, the kit
# carries a pnpm-workspace.yaml of its own so that its standalone install
# (CI's `extras` job) installs the kit rather than this project.
#
# EVERY EXEMPTION BELOW CARRIES ITS OWN REASON ON THE LINES ABOVE IT, and is
# pinned to the exact version this repository's pnpm-lock.yaml resolves, so a
# LATER release of the same package is graded again rather than inheriting the
# exemption. An exemption with no recorded reason is not committed.
# ---------------------------------------------------------------------------

# 1440 minutes = 24 hours, the floor the estate's drift-manifest.json requires
# of every package repo. pnpm's own rationale for the number: "Since malware is
# usually detected quickly, delaying updates by 24 hours will most likely
# prevent you from installing a bad version"
# (https://pnpm.io/supply-chain-security).
minimumReleaseAge: 1440

# Fail the install when a package's trust evidence is weaker than that of an
# earlier-published version of the same package (a trusted publisher that
# becomes provenance-only, or provenance that becomes nothing at all).
trustPolicy: no-downgrade

trustPolicyExclude:
  # reason: measured 2026-09-08 on pnpm 10.34.5. With trustPolicy on, a
  # from-scratch resolution of this repository's dependency set reds with
  # ERR_PNPM_TRUST_DOWNGRADE on undici-types, reached as a transitive of
  # @types/node and pinned at exactly this version by the committed
  # pnpm-lock.yaml. pnpm reports it as "Earlier versions had provenance
  # attestation, but this version has no trust evidence", which is a publisher
  # who stopped attaching provenance rather than a takeover: the package is a
  # types-only tarball with no runtime code and no install scripts.
  - "undici-types@6.21.0"
  # reason: measured 2026-09-08 on pnpm 10.34.5, same shape as the entry above
  # and found by the same from-scratch resolution once undici-types was
  # excluded. chokidar is reached as a transitive of tsup and is pinned at
  # exactly this version by the committed pnpm-lock.yaml; earlier chokidar
  # releases carry a provenance attestation and 4.0.3 carries none. pnpm's own
  # documentation uses this exact package and version as its worked example of
  # a trustPolicyExclude entry
  # (https://pnpm.io/settings/dependency-resolution).
  - "chokidar@4.0.3"
